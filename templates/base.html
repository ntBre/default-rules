<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            background-color: #fff;
        }

        .nav {
            padding: 10px 20px;
            border-bottom: 1px solid #e1e4e8;
            background-color: #f6f8fa;
        }

        .nav a {
            color: #0366d6;
            text-decoration: none;
            margin-right: 20px;
            font-size: 14px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            height: calc(100vh - 41px);
            max-width: 1400px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f6f8fa;
        }

        th {
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: #24292e;
            background-color: #f6f8fa;
            border-bottom: 1px solid #e1e4e8;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #e1e4e8;
        }

        th.sortable::after {
            content: ' ↕';
            opacity: 0.3;
        }

        th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background-color: #f6f8fa;
        }

        .category-correctness {
            background-color: #ff9aa9;
        }

        .category-suspicious {
            background-color: #ffc66a;
        }

        .category-complexity {
            background-color: #c7ff8a;
        }

        .category-perf {
            background-color: #8aff8a;
        }

        .category-style {
            background-color: #fff58a;
        }

        .category-pedantic {
            background-color: #8ac7ff;
        }

        .category-restriction {
            background-color: #c78aff;
        }

        td a {
            color: #0366d6;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        .code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
        }

        .rule-code {
            font-weight: 600;
            color: #0366d6;
        }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="on_by_default.html">Default Rules</a>
        <a href="on_by_default_v2.html">Default Rules v2</a>
        <a href="on_by_default_v3.html">Default Rules v3</a>
        <a href="off_by_default.html">Off-by-Default Rules</a>
        <a href="high_score.html">Off-by-Default Rules (Score &gt;11)</a>
        <a href="all_rules.html">All Rules</a>
        <a href="categories.html">Categories</a>
    </nav>

    {% block content %}{% endblock %}

    <script>
        // Sorting functionality
        const table = document.getElementById('rulesTable');
        if (table) {
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const headers = table.querySelectorAll('th.sortable');
            let sortState = {};

            const categoryOrder = {
                'correctness': 0,
                'suspicious': 1,
                'style': 2,
                'complexity': 3,
                'perf': 4,
                'pedantic': 5,
                'restriction': 6
            };

            headers.forEach((header, index) => {
                header.addEventListener('click', function() {
                    const column = this.getAttribute('data-column');
                    const columnIndex = index;

                    if (sortState.column === column) {
                        sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortState.column = column;
                        sortState.direction = 'asc';
                    }

                    headers.forEach(h => {
                        h.classList.remove('sorted-asc', 'sorted-desc');
                    });
                    this.classList.add(sortState.direction === 'asc' ? 'sorted-asc' : 'sorted-desc');

                    const sortedRows = rows.sort((a, b) => {
                        const aCell = a.cells[columnIndex].textContent.trim();
                        const bCell = b.cells[columnIndex].textContent.trim();

                        if (column === 'category') {
                            const aOrder = categoryOrder[aCell.toLowerCase()] ?? 999;
                            const bOrder = categoryOrder[bCell.toLowerCase()] ?? 999;
                            return sortState.direction === 'asc' ? aOrder - bOrder : bOrder - aOrder;
                        }

                        const aNum = parseFloat(aCell);
                        const bNum = parseFloat(bCell);

                        if (!isNaN(aNum) && !isNaN(bNum)) {
                            return sortState.direction === 'asc' ? aNum - bNum : bNum - aNum;
                        }

                        if (sortState.direction === 'asc') {
                            return aCell.localeCompare(bCell);
                        } else {
                            return bCell.localeCompare(aCell);
                        }
                    });

                    sortedRows.forEach(row => tbody.appendChild(row));
                });
            });
        }
    </script>
</body>
</html>
